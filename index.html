<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>СТО Система</title>
    <style>
        /* Стили прежние, сокращаю для краткости */
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f1f5f9; --accent: #3b82f6; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .tab-btn { padding: 10px; background: #334155; border: none; color: white; cursor: pointer; }
        .active { background: #3b82f6; }
        .cart-item { background: #1e293b; padding: 10px; border-bottom: 1px solid #334155; }
        .btn-action { background: #3b82f6; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div id="ui" style="display:none;">
    <div class="tabs">
        <button class="tab-btn" id="b1" onclick="switchTab('catalog')">📦 Каталог</button>
        <button class="tab-btn" id="b2" onclick="switchTab('cart')">🛒 Корзина</button>
        <button class="tab-btn" id="b-admin" onclick="switchTab('admin')">⚙️ Админка</button>
        <button class="tab-btn" onclick="logout()" style="background:#ef4444;">🚪 Выход</button>
    </div>
    <div id="view-container"></div>
</div>

<script src="data.js"></script>
<script>
    let cart = {};
    let currentUser = JSON.parse(localStorage.getItem('current_user'));

    function login() {
        let users = JSON.parse(localStorage.getItem('users') || '[{"login": "0666261351", "pass": "Saranskaya59", "role": "manager", "assignedCars": []}]');
        const l = document.getElementById('inLogin').value;
        const p = document.getElementById('inPass').value;
        const u = users.find(x => x.login === l && x.pass === p);
        if(u) { 
            localStorage.setItem('current_user', JSON.stringify(u)); 
            location.reload(); 
        } else {
            alert("Неверный логин или пароль. Всего юзеров в базе: " + users.length);
        }
    }

    function logout() { localStorage.removeItem('current_user'); location.reload(); }

    function switchTab(t) {
        const cont = document.getElementById('view-container');
        if(t === 'catalog') {
            cont.innerHTML = `<div><input id="search" onkeyup="renderTable()" placeholder="Поиск..."><div id="tbody"></div></div>`;
            renderTable();
        } else if(t === 'cart') {
            cont.innerHTML = `<h3>Корзина</h3><input id="vin" placeholder="VIN"><div id="cart-list"></div><button class="btn-action" onclick="sendToTelegram()">Отправить</button>`;
            renderCart();
        } else if(t === 'admin') {
            cont.innerHTML = `<h3>Пользователи</h3><input id="nL" placeholder="Логин"><input id="nP" placeholder="Пароль"><button onclick="addUser()">Добавить</button><div id="user-list"></div>`;
            renderAdmin();
        }
    }

    function renderTable() {
        const s = document.getElementById('search').value.toLowerCase();
        document.getElementById('tbody').innerHTML = db.filter(i => i.name.toLowerCase().includes(s)).map(i => `<div>${i.art} - ${i.name} <button onclick="addToCart('${i.art}')">➕</button></div>`).join('');
    }

    function addToCart(art) {
        if(!cart[art]) cart[art] = { ...db.find(i=>i.art===art), qty: 1 };
        else cart[art].qty++;
        alert("Добавлено");
    }

    function renderCart() {
        const list = document.getElementById('cart-list');
        list.innerHTML = '';
        for(let art in cart) {
            list.innerHTML += `<div class="cart-item">${cart[art].art} - ${cart[art].name} (x${cart[art].qty}) <select id="st-${art}"><option>Новая</option><option>В ремонт</option></select></div>`;
        }
    }

    async function sendToTelegram() {
        const vin = document.getElementById('vin').value;
        if(!vin) return alert('Введите VIN');
        
        let text = `🛠 Заявка: ${vin}\n`;
        for(let art in cart) {
            const st = document.getElementById('st-'+art).value;
            // ТУТ ИСПРАВЛЕНИЕ: добавил cart[art].art
            text += `\nАрт: ${cart[art].art} | ${cart[art].name} | ${cart[art].qty} шт. | Статус: ${st}`;
        }

        const response = await fetch(`https://api.telegram.org/bot8625933875:AAG-BVWfpoo3kDQjPvQ5XxJA5r8kEU7XH4w/sendMessage`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: '483561525', text: text, parse_mode: 'HTML' })
        });
        const res = await response.json();
        if(res.ok) { alert('✅ Отправлено!'); cart = {}; switchTab('catalog'); } 
        else { alert('❌ Ошибка отправки: ' + JSON.stringify(res)); }
    }

    function renderAdmin() {
        let users = JSON.parse(localStorage.getItem('users'));
        document.getElementById('user-list').innerHTML = users.map(u => `<div>${u.login} (${u.role})</div>`).join('');
    }

    function addUser() {
        let users = JSON.parse(localStorage.getItem('users'));
        users.push({login: document.getElementById('nL').value, pass: document.getElementById('nP').value, role: 'mechanic'});
        localStorage.setItem('users', JSON.stringify(users));
        renderAdmin();
    }

    if (currentUser) {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('ui').style.display = 'block';
        if(currentUser.role === 'manager') document.getElementById('b-admin').style.display = 'inline-block';
        switchTab('catalog');
    }
</script>
</body>
</html>
