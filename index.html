<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СТО Система Управления</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f1f5f9; --accent: #3b82f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .content { width: 100%; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        
        /* Табы и интерфейс */
        .tabs { display: flex; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 15px; background: #334155; color: #94a3b8; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--accent); color: white; }
        
        input, select { padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; width: 100%; box-sizing: border-box; }
        .btn-action { background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        
        /* Админ стили */
        .admin-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
        .badge-role { font-size: 10px; background: #475569; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:10000; display:flex; justify-content:center; align-items:center;">
    <div style="background:#1e293b; padding:30px; border-radius:12px; width:300px;">
        <h2 style="color:white; margin-top:0;">Авторизация</h2>
        <input type="text" id="inLogin" placeholder="Логин">
        <input type="password" id="inPass" placeholder="Пароль" style="margin-top:10px;">
        <button onclick="login()" class="btn-action" style="margin-top:15px;">Войти</button>
    </div>
</div>

<div class="content">
    <div class="tabs" id="main-tabs">
        <button class="tab-btn active" onclick="switchTab('catalog')">📦 Каталог</button>
        <button class="tab-btn" onclick="switchTab('cart')">🛒 Корзина</button>
        <button class="tab-btn" onclick="switchTab('history')">📝 История</button>
        <button class="tab-btn" id="admin-tab-btn" onclick="switchTab('admin')" style="display:none; background:#8b5cf6;">⚙️ Управление</button>
        <button class="tab-btn" onclick="logout()" style="background:#ef4444;">🚪</button>
    </div>

    <div id="view-container"></div>
</div>

<script src="data.js"></script>
<script>
    // 1. Инициализация пользователей
    if (!localStorage.getItem('users')) {
        localStorage.setItem('users', JSON.stringify([{login: 'admin', pass: 'admin', role: 'manager'}]));
    }

    let currentUser = JSON.parse(localStorage.getItem('current_user'));

    function login() {
        const users = JSON.parse(localStorage.getItem('users'));
        const l = document.getElementById('inLogin').value;
        const p = document.getElementById('inPass').value;
        const user = users.find(u => u.login === l && u.pass === p);
        if(user) {
            localStorage.setItem('current_user', JSON.stringify(user));
            location.reload();
        } else { alert("Неверно!"); }
    }

    function logout() { localStorage.removeItem('current_user'); location.reload(); }

    // 2. Рендер Админки
    function renderAdmin() {
        const users = JSON.parse(localStorage.getItem('users'));
        let html = `<h3>Пользователи</h3>`;
        users.forEach(u => {
            html += `<div class="admin-card">
                <strong>${u.login}</strong> <span class="badge-role">${u.role}</span>
                <button onclick="deleteUser('${u.login}')" style="background:none; border:none; color:red; cursor:pointer; float:right;">✕</button>
            </div>`;
        });
        html += `<h3>Добавить сотрудника</h3>
                 <input id="newLog" placeholder="Логин">
                 <input id="newPass" placeholder="Пароль" style="margin-top:5px;">
                 <select id="newRole" style="margin-top:5px;"><option value="mechanic">Механик</option><option value="manager">Менеджер</option></select>
                 <button onclick="addUser()" class="btn-action" style="margin-top:10px;">Создать</button>`;
        return html;
    }

    function addUser() {
        const users = JSON.parse(localStorage.getItem('users'));
        users.push({ login: document.getElementById('newLog').value, pass: document.getElementById('newPass').value, role: document.getElementById('newRole').value });
        localStorage.setItem('users', JSON.stringify(users));
        switchTab('admin');
    }

    function deleteUser(log) {
        let users = JSON.parse(localStorage.getItem('users'));
        users = users.filter(u => u.login !== log);
        localStorage.setItem('users', JSON.stringify(users));
        switchTab('admin');
    }

    // 3. Запуск интерфейса
    if (currentUser) {
        document.getElementById('login-screen').style.display = 'none';
        if (currentUser.role === 'manager') document.getElementById('admin-tab-btn').style.display = 'block';
        switchTab('catalog');
    }

    function switchTab(t) {
        const cont = document.getElementById('view-container');
        if(t === 'admin') cont.innerHTML = renderAdmin();
        else if(t === 'catalog') cont.innerHTML = "Здесь будет твой каталог (код из прошлых версий)";
        // ... (сюда переносишь логику рендера из прошлых версий для других табов)
    }
</script>
</body>
</html>
